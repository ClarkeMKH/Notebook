<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>HTML 5 Boilerplate</title>
		<style></style>
	</head>
  
  
	<body style="width:100%; height:100dvh; padding:0px; margin:0px;">
	
		<canvas id="cnv" style="width:100%; height:100%; position:absolute;"></canvas>
		
		<div id="txt" style="width:calc(100% - 10px); height:calc(100% - 10px); padding:5px; background-color:#444444; color:#eeeeee;"></div>
	
	
	
		<script>

			const cnv = document.getElementById("cnv");
			const txt = document.getElementById("txt");
			
			const script = `
				# Room 1
					Hi Going to [[Room 2]](Room 3).
					{
						console.log("Test 1");
						console.log("Test 2");
					}
					
					
					Mate
					
					
					
				
				# Room 2
					Test
					Test 2
			`;
			
			let areas = areasOfScript();
			
			window.vars = {};
			
			showArea(Object.keys(areas)[0]);
			
			console.log(areas)
			
			
			function areasOfScript(){
				let obj = {};
				let section = null;
				script.replace(/^[ \t]+/gm, "").split("\n").forEach((line, index) => {
					if (line.startsWith("#")) {
						section = line.substring(1).trimStart();
						if (!(section in obj)) obj[section] = [];
					} else {
						if (section) obj[section].push(line);
					}
				});
				
				for (const section in obj) {
				  for (let i=obj[section].length-1; i>=0; i--) {
				    if (obj[section][i].trim() === "") {
				      obj[section].splice(i, 1);
				    } else {
				      break;
				    }
				  }
				}
				return obj;
			}
			
			
			
			function showArea(area) {
				if (!areas[area] || area.includes('?')) return console.log(`Invalid Area : ${area}.\n\nIt either does not exist or contains a '?'.`)
				let HTML = ``;
				let checkingJS = false;
				let JS = ``;
				areas[area].forEach((line, index) => {
					if (line.includes('{{')) {
					  if (line.includes('}}')) JS = line.trim().slice(2, -2);
					  return checkingJS = !line.includes('}}');
					}
					if (line.includes('}}')) return checkingJS = false;
					if (line == "\n") line = "<br>"
					if (checkingJS) {
						JS += line;
					} else {
					
            const ammendedLine = line.replace(/\[\[([^\]]+)\]\](?:\(([^)]*)\))?/g, (match, sb, cb) => {
              const tag = "";
              let txtToShow = "";
              
              if (cb) {
                if (cb.includes('?')) cb = eval(cb);
              }
              
              if (sb.includes('?')) {
                
              } else {
                tag = `<a href="#" onclick="showArea('${sb}'); return false;">${cb}</a>`;
              }
              return sb;
            });
					  
						HTML += ammendedLine + '<br>';
					}
				});
				if (JS) new Function(JS)();
				txt.innerHTML += '<div>' + HTML + '</div>'
			}
			
			
			/*
				TO DO
	
				- Add [[]] checking and [[]]() allowing you to show other Areas and using () ? v1 : v2 logic.
			*/
			
		</script>
	</body>
</html>
