<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>HTML 5 Boilerplate</title>
		<style></style>
	</head>
  
  
	<body style="width:100%; height:100dvh; padding:0px; margin:0px;">
	
		<canvas id="cnv" style="width:100%; height:100%; position:absolute;"></canvas>
		
		<div id="txt" style="width:calc(100% - 10px); height:calc(100% - 10px); padding:5px; background-color:#444444; color:#eeeeee;"></div>
	
	
	
		<script>

			const cnv = document.getElementById("cnv");
			const txt = document.getElementById("txt");
			
			const script = `
				# Room 1
					Hi
					{
						console.log("Test 1");
						console.log("Test 2");
					}
					
					Mate
				
				# Room 2
					Test
					Test 2
			`;
			
			let areas = areasOfScript();
			
			showArea(Object.keys(areas)[0]);
			
			
			
			function areasOfScript(){
				let obj = {};
				let section = null;
				script.replace(/^[ \t]+/gm, "").split("\n").forEach((line, index) => {
					if (line.startsWith("#")) {
						section = line.substring(1).trimStart();
						if (!(section in obj)) obj[section] = [];
					} else {
						if (section) obj[section].push(line);
					}
				});
				return obj;
			}
			
			
			
			function showArea(area) {
				if (!areas[area]) return console.log(`Invalid Area : ${area}`)
				let HTML = ``;
				let checkingJS = false;
				let JS = ``;
				areas[area].forEach((line, index) => {
					if (line.startsWith('{') || line.startsWith('}')) return checkingJS = line.startsWith('{');
					if (line == "\n") line = "<br>"
					if (checkingJS) {
						JS += line;
					} else {
						HTML += line + '<br>';
					}
				});
				if (JS) new Function(JS)();
				txt.innerHTML += '<div>' + HTML + '</div>'
			}
			
			
			
			
			/*
				TO DO
				
				- have it so that the last \n lines from an area are removed for consistency.
				- Add [[]] checking and [[]]() for lines in showArea.
			*/
			
		</script>
	</body>
</html>
