<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<meta name="description" content="My Website">
		<meta name="author" content="Clarke Harrison">
		<link rel="icon" href="https://harrison-home.co.uk/icon.png" type="image/png">
		<title>Harrison Home</title>
	</head>

	<body style="margin:0px; padding:0px; width:100%; height:100dvh; position:relative; overflow:hidden; overscroll-behavior:none;">

		<div id="site" style="width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none;">
			<div id="header" style="width:100%; display:flex; justify-content:center; align-items:center; text-align:center;"></div>
			<div id="contents" style="width:100%; height:100%; display:flex; overflow:hidden; background-color:#444444;">
				<div id="filePane" style="height:100%; width:400px; min-width:400px; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;"></div>
				<div id="outputPane" style="height:calc(100% - 10px); width:calc(100% - 10px); margin:5px; border-radius:8px; background-color:#222222; display:flex; justify-content:center; align-items:center; overflow:auto; scrollbar-color:#aaaaaa #222222;"></div>
			</div>
			<div id="footer" style="width:100%; display:flex; justify-content:center; align-items:center; text-align:center;"></div>
		</div>
		

		

		<div id="rightClickFileMenu" style="display:none; flex-direction:column; position:absolute; padding:5px; width:150px; background-color:#333333; border:solid #222222 1px; color:#eeeeee; z-index:99999;"></div>

		<script src="https://harrison-home.co.uk/modules/zipGenerator.js"></script>
		<script src="https://harrison-home.co.uk/modules/qrCode.js"></script>
		<script src="https://harrison-home.co.uk/modules/qrCodeReader.js"></script>
		<script src="https://harrison-home.co.uk/modules/kaplay.js"></script>
		<script src="https://harrison-home.co.uk/modules/barcode.js"></script>
		<script src="https://harrison-home.co.uk/modules/pdf-lib.js"></script>
		<script src="https://harrison-home.co.uk/modules/three.js"></script>

		<script>
			const header = document.getElementById("header");
			const contents = document.getElementById("contents");
			const leftPane = document.getElementById("leftPane");
			const filePane = document.getElementById("filePane");
			const toggleFilePane = document.getElementById("toggleFilePane");
			const outputPane = document.getElementById("outputPane");
			const rightClickFileMenu = document.getElementById("rightClickFileMenu");
			const footer = document.getElementById("footer");

			const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;

			let dragData = null;

			const LONG_PRESS_MS = 500;
			const MOVE_THRESHOLD = 12;

			let touchState = {
				timer: null,
				startX: 0,
				startY: 0,
				lastX: 0,
				lastY: 0,
				moved: false,
				longPressTriggered: false,
				dragging: false,
				sourceMeta: null,
				ghost: null,
				suppressClick: false,
				pointerId: null
			};

			let files = {
				"Scripts": {
					"Download Files.js": "downloadFile(JSON.stringify(files, null, 4), \"Files.json\");",
					"onRun.js": "// Any JS Here runs when you load the page.",
					"Upload Files.js": "uploadFile(function(fileName, fileData) {\n    if (!fileName.endsWith(\".json\")) return alert(\"You must upload a JSON file.\");\n    files = JSON.parse(fileData);\n    populateFilePane();\n})"
				},
				"Click Me.txt": "Welcome!\n\n\nThe purpose of this site is to provide a secure and easy way to manage simple text documents whilst allowing you to easily create powerful JavaScript functions.\nThis allows you to either use it as a simple notepad or a host of several custom web applications all run in one place.\n\nTo get started you'll see above the \"Click Me.txt\" on the left there is a drop-down folder that you can click to reveal 2 JavaScript files, indicated by them ending in \".js\".\nYou can click them to edit the JavaScript code, or right click them to \"Run JS\" and dynamically run the code.\n\nWhen you right click any folder or file, you can create or rename them. The extension of a file (eg, .txt or .js) indicates the type of file.\n\nFile Types:\n    - .txt  =>  These are simple text files which you can easily edit and read like this one.\n    - .js  =>  These are JavaScript files and can be dynamically run as described above.\n    - .html  =>  These are HTML files and can be easily edited and dynamically shown/rendered via the right click.\n\nYou can also upload any file and if it's a media file such as a picture, song or video, these can usually be played/previewed in the browser directly via clicking them.\n\nAll changes to the files automatically save to your browsers cache. You can use the pre-bundled JS files to download all of your files and upload them on another device.\nThis method can work to transfer your creations or simply as a backup.\n\n\nAny issues or queries please contact Clarke."
			};

			const dbPromise = new Promise(resolve => {
				const request = indexedDB.open("cacheDB", 1);
				request.onupgradeneeded = () => request.result.createObjectStore("ch");
				request.onsuccess = () => resolve(request.result);
			});

			loadFromCache("files")
			    .then(e => { if (e) files = e; })
			    .catch(console.warn)
			    .finally(() => {
			        populateFilePane();
			        onRun(files);
			    });

			function onRun(obj) {
			    if (!obj || typeof obj !== "object") return false;
			    if ("onRun.js" in obj) return new Function(obj["onRun.js"])(), true;
			    return Object.values(obj).some(onRun);
			}


			function clearTouchTimer() {
				if (touchState.timer) {
					clearTimeout(touchState.timer);
					touchState.timer = null;
				}
			}

			function resetTouchState() {
				clearTouchTimer();
				if (touchState.ghost) {
					touchState.ghost.remove();
				}
				touchState = {
					timer: null,
					startX: 0,
					startY: 0,
					lastX: 0,
					lastY: 0,
					moved: false,
					longPressTriggered: false,
					dragging: false,
					sourceMeta: null,
					ghost: null,
					suppressClick: touchState.suppressClick,
					pointerId: null
				};
			}

			function createTouchGhost(text) {
				const ghost = document.createElement("div");
				ghost.style.cssText = `
					position:fixed;
					left:0px;
					top:0px;
					transform:translate(-9999px, -9999px);
					padding:6px 10px;
					background:#555555ee;
					border:solid #222222 1px;
					box-shadow:2px 2px 6px #00000088;
					color:#ffffff;
					pointer-events:none;
					z-index:99998;
					max-width:240px;
					overflow:hidden;
					white-space:nowrap;
					text-overflow:ellipsis;
					border-radius:6px;
					user-select:none;
					-webkit-user-select:none;
				`;
				ghost.textContent = text;
				document.body.appendChild(ghost);
				return ghost;
			}

			function moveTouchGhost(x, y) {
				if (!touchState.ghost) return;
				touchState.ghost.style.transform = `translate(${x + 12}px, ${y + 12}px)`;
			}

			function startTouchDrag(meta, x, y) {
				touchState.dragging = true;
				touchState.sourceMeta = meta;
				touchState.ghost = createTouchGhost(meta.key);
				moveTouchGhost(x, y);
			}

			function findDropTargetElement(x, y) {
				const el = document.elementFromPoint(x, y);
				if (!el) return null;
				return el.closest(".fileEntry");
			}

			function handleTouchDrop(x, y) {
				if (!touchState.dragging || !touchState.sourceMeta) return;

				const source = touchState.sourceMeta;
				const targetElem = findDropTargetElement(x, y);

				if (targetElem && targetElem._fileMeta) {
					const target = targetElem._fileMeta;

					if (target.folder) {
						if (source.parent === target.obj[target.key]) return;
						if (source.div === target.div) return;

						target.obj[target.key][source.key] = source.parent[source.key];
						delete source.parent[source.key];

						populateFilePane();
						return;
					}
				}

				const rect = filePane.getBoundingClientRect();
				const insideFilePane = (
					x >= rect.left &&
					x <= rect.right &&
					y >= rect.top &&
					y <= rect.bottom
				);

				if (insideFilePane && source.parent !== files) {
					files[source.key] = source.parent[source.key];
					delete source.parent[source.key];
					populateFilePane();
				}
			}

			function showFileMenu(e, obj, key, folder, div) {
				if (e?.preventDefault) e.preventDefault();

				const clientX = e.clientX ?? 0;
				const clientY = e.clientY ?? 0;

				rightClickFileMenu.style.display = "flex";

				if (clientY > (window.innerHeight / 2)) {
					rightClickFileMenu.style.top = "";
					rightClickFileMenu.style.bottom = `${window.innerHeight - clientY}px`;
				} else {
					rightClickFileMenu.style.bottom = "";
					rightClickFileMenu.style.top = `${clientY}px`;
				}

				rightClickFileMenu.style.left = `${clientX}px`;
				rightClickFileMenu.innerHTML = "";

				function rightClickElem(name, onClick, lineUnder = true) {
					let newElem = document.createElement("div");
					newElem.style.cssText = `
						padding:4px 0px;
						${lineUnder ? "border-bottom:solid #eeeeee 1px;" : ""}
						cursor:pointer;
						user-select:none;
						-webkit-user-select:none;
						-webkit-touch-callout:none;
					`;
					newElem.innerHTML = name;
					newElem.onclick = () => {
						rightClickFileMenu.style.display = "none";
						onClick();
					};
					rightClickFileMenu.appendChild(newElem);
				}

				if (key.endsWith(".js")) {
					rightClickElem(`Run JS`, async function() {
						const AsyncFunction = async function () {}.constructor;
						await new AsyncFunction(obj[key])();
					});
				}

				if (key.endsWith(".html")) {
					rightClickElem(`Show HTML`, function() {
						outputPane.innerHTML = "";
						const iframe = document.createElement("iframe");
						const blob = new Blob([obj[key]], { type: 'text/html' });
						iframe.style.cssText = "width:100%; height:100%; padding:0px; margin:0px; outline:none; border:none;";
						iframe.src = URL.createObjectURL(blob);
						outputPane.appendChild(iframe);
					});
				}

				rightClickElem("Create File", function() {
					const newName = prompt("Please enter the name of the file including it's extension.");
					if (newName == null || newName.trim() === "") return alert("Invalid file name.");
					if (folder) {
						if (newName in obj[key]) return alert("A file with that name already exists here.");
						obj[key][newName] = "";
					} else {
						if (newName in obj) return alert("A file with that name already exists here.");
						obj[newName] = "";
					}
					populateFilePane();
				});

				rightClickElem("Create Folder", function() {
					const newName = prompt("Please enter the name of the folder.");
					if (newName == null || newName.trim() === "") return alert("Invalid file name.");
					if (folder) {
						if (newName in obj[key]) return alert("A folder with that name already exists here.");
						obj[key][newName] = {};
					} else {
						if (newName in obj) return alert("A folder with that name already exists here.");
						obj[newName] = {};
					}
					populateFilePane();
				});

				rightClickElem("Upload File", () => {
					uploadFile(function(fileName, fileData) {
						if (fileName in files) return alert("A folder with that name already exists here.");
						files[fileName] = fileData;
						populateFilePane();
					});
				});

				rightClickElem(`Rename ${folder ? "Folder" : "File"}`, () => {
					const newName = prompt(`Enter new name including extension if there was one.\n\nPrevious : ${key}`);
					if (newName == null || newName.trim() === "") return;
					if (newName in obj) return alert("A file or folder with that name already exists here.");
					obj[newName] = obj[key];
					delete obj[key];
					populateFilePane();
				});

				if (folder) {
					rightClickElem("Download Folder", () => {
						downloadZIP(obj[key], key);
					});
				} else {
					rightClickElem("Download File", () => {
						downloadFile(obj[key], key);
					});
				}

				rightClickElem(`Delete ${folder ? "Folder" : "File"}`, function() {
					if (Object.keys(files).length == 1) return alert("You cannot delete the last file/folder.");
					if (prompt(`Enter 'YES' if you are sure that you want to delete ${key}.`) == "YES") delete obj[key];
					populateFilePane();
				}, false);
			}

			function populateFilePane() {
				files = organizeFiles(files);
				saveToCache("files", files);
				filePane.innerHTML = "";
				outputPane.innerHTML = "";

				folderSearch(files, 0, filePane);

				function folderSearch(obj, indent, parent) {
					for (const key in obj) {
						const folder = typeof obj[key] === "object" && obj[key] !== null && !Array.isArray(obj[key]);

						let cont = document.createElement("div");
						cont.style.cssText = `width:100%; display:${indent === 0 ? "flex" : "none"}; flex-direction:column;`;
						parent.appendChild(cont);

						let div = document.createElement("div");
						div.className = "fileEntry";
						div.style.cssText = `
							width:calc(100% - ${((indent * 20) + 5)}px - 15px);
							display:flex;
							border:solid #222222 1px;
							box-shadow:1px 1px 2px #111111;
							margin:5px ${(indent * 20) + 5}px;
							overflow-x:hidden;
							text-wrap:nowrap;
							padding:4px;
							color:#ffffff;
							cursor:pointer;
							user-select:none;
							-webkit-user-select:none;
							-webkit-touch-callout:none;
							-webkit-tap-highlight-color:transparent;
							touch-action:none;
						`;
						div.innerHTML = `${folder ? "► " : ""}${key}`;
						div.draggable = !isTouchDevice;

						div._fileMeta = { parent: obj, obj, key, folder, div, cont };

						if (!isTouchDevice) {
							div.addEventListener("dragstart", () => {
								dragData = { parent: obj, key, div, draggingInFilePane: true };
							});

							if (folder) {
								div.addEventListener("dragover", (e) => {
									e.preventDefault();
									div.style.backgroundColor = "#333333";
								});

								div.addEventListener("dragleave", () => {
									div.style.backgroundColor = "";
								});

								div.addEventListener("drop", (e) => {
									e.preventDefault();
									div.style.backgroundColor = "";

									if (!dragData) return;
									if (dragData.parent === obj[key]) return;
									if (dragData.div == div) return;

									obj[key][dragData.key] = dragData.parent[dragData.key];
									delete dragData.parent[dragData.key];

									dragData = null;
									populateFilePane();
								});
							}
						}

						div.addEventListener("click", (e) => {
							if (touchState.suppressClick) {
								touchState.suppressClick = false;
								e.preventDefault();
								return;
							}

							if (e.button !== 0) return;

							if (folder) {
								for (let i = 1; i < cont.children.length; i++) {
									cont.children[i].style.display =
										cont.children[i].style.display === "flex" ? "none" : "flex";
								}
								div.innerHTML = div.innerHTML.startsWith("►")
									? `▼ ${key}`
									: `► ${key}`;
							} else {
								outputPane.innerHTML = "";
								document.querySelectorAll("#filePane *").forEach((elem) => {
									elem.style.backgroundColor = "rgba(0,0,0,0)";
								});
								div.style.backgroundColor = "#666666";

								if (typeof obj[key] === "string" && obj[key].startsWith("data:image/")) {
									let img = document.createElement("img");
									img.style.cssText = "width:calc(100% - 60px); height:calc(100% - 60px); padding:none; border:none; object-fit:contain; outline:none; image-rendering:pixelated;";
									img.src = obj[key];
									outputPane.appendChild(img);
								} else if (typeof obj[key] === "string" && obj[key].startsWith("data:audio/")) {
									const audio = document.createElement('audio');
									audio.style.cssText = "width:calc(100% - 60px);";
									audio.src = obj[key];
									audio.controls = true;
									outputPane.innerHTML = "";
									outputPane.appendChild(audio);
								} else if (typeof obj[key] === "string" && obj[key].startsWith("data:video/")) {
									const video = document.createElement("video");
									video.style.cssText = "width:calc(100% - 60px); height:calc(100% - 60px); padding:none; border:none; object-fit:contain; outline:none;";
									video.src = obj[key];
									video.controls = true;
									video.width = 640;
									video.height = 480;
									outputPane.appendChild(video);
								} else {
									let txtArea = document.createElement("textarea");
									txtArea.style.cssText = `width:calc(100% - 20px); height:calc(100% - 20px); padding:10px; border:none; outline:none; background-color:rgba(0,0,0,0); white-space:pre; resize:none; color:#ffffff; scrollbar-color:#aaaaaa #222222;`;
									txtArea.value = obj[key];
									txtArea.addEventListener("input", () => {
										obj[key] = txtArea.value;
										saveToCache("files", files);
									});
									outputPane.appendChild(txtArea);

									txtArea.addEventListener('keydown', function(e) {
										if (e.key === 'Tab') {
											e.preventDefault();
											const start = this.selectionStart;
											const end = this.selectionEnd;
											const spaces = '    ';
											this.value = this.value.substring(0, start) + spaces + this.value.substring(end);
											this.selectionStart = this.selectionEnd = start + spaces.length;
										}
									});
								}
							}
						});

						div.addEventListener("contextmenu", (e) => {
							showFileMenu(e, obj, key, folder, div);
						});

						div.addEventListener("pointerdown", (e) => {
							if (!isTouchDevice) return;
							if (e.pointerType !== "touch") return;

							e.preventDefault();

							rightClickFileMenu.style.display = "none";

							touchState.pointerId = e.pointerId;
							touchState.startX = e.clientX;
							touchState.startY = e.clientY;
							touchState.lastX = e.clientX;
							touchState.lastY = e.clientY;
							touchState.moved = false;
							touchState.longPressTriggered = false;
							touchState.dragging = false;
							touchState.sourceMeta = { parent: obj, obj, key, folder, div, cont };
							touchState.suppressClick = false;

							clearTouchTimer();
							touchState.timer = setTimeout(() => {
								if (!touchState.moved && !touchState.dragging) {
									touchState.longPressTriggered = true;
									touchState.suppressClick = true;
									showFileMenu(
										{ preventDefault() {}, clientX: touchState.lastX, clientY: touchState.lastY },
										obj,
										key,
										folder,
										div
									);
								}
							}, LONG_PRESS_MS);
						}, { passive: false });

						div.addEventListener("pointermove", (e) => {
							if (!isTouchDevice) return;
							if (e.pointerType !== "touch") return;
							if (touchState.pointerId !== e.pointerId) return;

							e.preventDefault();

							touchState.lastX = e.clientX;
							touchState.lastY = e.clientY;

							const dx = e.clientX - touchState.startX;
							const dy = e.clientY - touchState.startY;
							const dist = Math.hypot(dx, dy);

							if (dist > MOVE_THRESHOLD) {
								touchState.moved = true;
								clearTouchTimer();

								if (!touchState.longPressTriggered && !touchState.dragging) {
									touchState.suppressClick = true;
									startTouchDrag({ parent: obj, obj, key, folder, div, cont }, e.clientX, e.clientY);
								}
							}

							if (touchState.dragging) {
								moveTouchGhost(e.clientX, e.clientY);
							}
						}, { passive: false });

						div.addEventListener("pointerup", (e) => {
							if (!isTouchDevice) return;
							if (e.pointerType !== "touch") return;
							if (touchState.pointerId !== e.pointerId) return;

							e.preventDefault();
							clearTouchTimer();

							if (touchState.dragging) {
								handleTouchDrop(e.clientX, e.clientY);
							}

							resetTouchState();
						}, { passive: false });

						div.addEventListener("pointercancel", (e) => {
							if (!isTouchDevice) return;
							if (e.pointerType !== "touch") return;
							if (touchState.pointerId !== e.pointerId) return;

							resetTouchState();
						});

						cont.appendChild(div);
						if (folder) folderSearch(obj[key], indent + 1, cont);
					}
				}
			}

			if (!isTouchDevice) {
				filePane.addEventListener("dragover", (e) => {
					e.preventDefault();
				});

				filePane.addEventListener("drop", (e) => {
					e.preventDefault();

					if (!dragData) return;
					if (dragData.parent === files) return;

					files[dragData.key] = dragData.parent[dragData.key];
					delete dragData.parent[dragData.key];

					dragData = null;
					populateFilePane();
				});
			}

			filePane.addEventListener("contextmenu", (e) => {
				e.preventDefault();
			});

			document.addEventListener("click", (e) => {
				if (!rightClickFileMenu.contains(e.target)) {
					rightClickFileMenu.style.display = "none";
				}
			});

			document.addEventListener("pointerdown", (e) => {
				if (!rightClickFileMenu.contains(e.target)) {
					rightClickFileMenu.style.display = "none";
				}
			});

			function downloadFile(data, name) {
				let blob;
				if (typeof data === "string" && data.startsWith('data:')) {
					const [meta, content] = data.split(',');
					const mime = meta.match(/:(.*?);/)[1];
					const u8arr = new Uint8Array(atob(content).split('').map(c => c.charCodeAt(0)));
					blob = new Blob([u8arr], { type: mime });
				} else {
					blob = new Blob([data], { type: 'text/plain' });
				}
				const a = document.createElement('a');
				a.href = URL.createObjectURL(blob);
				a.download = name;
				a.click();
				URL.revokeObjectURL(a.href);
			}

			function uploadFile(callback) {
				const input = document.createElement('input');
				input.type = 'file';
				input.style.display = 'none';
				input.onchange = () => {
					const file = input.files[0];
					if (!file) return;
					const reader = new FileReader();
					const isURL = file.type.startsWith('image/') || file.type.startsWith('audio/') || file.type.startsWith('video/');
					reader.onload = () => {
						input.remove();
						callback(file.name, reader.result);
					};
					if (isURL) {
						reader.readAsDataURL(file);
					} else {
						reader.readAsText(file);
					}
				};
				document.body.appendChild(input);
				input.click();
			}

			async function downloadZIP(contents, name) {
				const zip = new JSZip();

				async function search(obj, fld) {
					for (const key in obj) {
						if (typeof obj[key] === "object" && obj[key] !== null && !Array.isArray(obj[key]) && !(obj[key] instanceof HTMLElement)) {
							await search(obj[key], fld.folder(key));
						} else {
							if (typeof obj[key] === "string" && obj[key].startsWith("data:")) {
								const [meta, content] = obj[key].split(',');
								const mime = meta.match(/:(.*?);/)[1];
								const u8arr = new Uint8Array(atob(content).split('').map(c => c.charCodeAt(0)));
								fld.file(key, u8arr, { binary: true });
							} else {
								fld.file(key, obj[key]);
							}
						}
					}
				}

				await search(contents, zip);

				async function generateAndDownload() {
					const content = await zip.generateAsync({ type: "blob" });
					const link = document.createElement("a");
					link.href = URL.createObjectURL(content);
					link.download = `${name}.zip`;
					link.click();
					URL.revokeObjectURL(link.href);
				}

				await generateAndDownload();
			}

			function organizeFiles(obj) {
				if (obj === null || typeof obj !== "object" || Array.isArray(obj)) {
					return obj;
				}

				const entries = Object.entries(obj);

				const objectEntries = entries
					.filter(([_, value]) => value && typeof value === "object" && !Array.isArray(value))
					.sort(([a], [b]) => a.localeCompare(b));

				const primitiveEntries = entries
					.filter(([_, value]) => !(value && typeof value === "object" && !Array.isArray(value)))
					.sort(([a], [b]) => a.localeCompare(b));

				const sorted = {};
				for (const [key, value] of objectEntries) {
					sorted[key] = organizeFiles(value);
				}
				for (const [key, value] of primitiveEntries) {
					sorted[key] = value;
				}
				return sorted;
			}

			function textAreaTabFunctionality(txtArea) {
			    txtArea.addEventListener('keydown', function(e) {
			        if (e.key === 'Tab') {
			            e.preventDefault();
			            const start = this.selectionStart;
			            const end = this.selectionEnd;
			            const spaces = '    ';
			            this.value = this.value.substring(0, start) + spaces + this.value.substring(end);
			            this.selectionStart = this.selectionEnd = start + spaces.length;
			        }
			    });
			}

			function saveToCache(key="files", value=files) {
				dbPromise.then(db => db.transaction("ch", "readwrite").objectStore("ch").put(value, key));
			}

			function loadFromCache(key) {
			    return dbPromise.then(db => new Promise((resolve, reject) => {
			        const req = db.transaction("ch").objectStore("ch").get(key);
			        req.onsuccess = () => resolve(req.result ?? null);
			        req.onerror = () => reject(req.error);
			    }));
			}

			function deleteFromCache(key) {
				dbPromise.then(db => db.transaction("ch", "readwrite").objectStore("ch").delete(key));
			}

			function resetCache() {
				dbPromise.then(db => {
					db.close();
					return new Promise(resolve => indexedDB.deleteDatabase("cacheDB").onsuccess = resolve);
				});
			}
		</script>

	</body>
</html>
